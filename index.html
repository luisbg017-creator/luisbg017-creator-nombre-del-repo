<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SAFARI 2026 — LEGACY</title></head>
<body style="margin:0;background:#000;color:#fff;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh">
<div id="loading">SAFARI 2026 — LEGACY · CARGANDO…</div>
<script>
(async()=>{
  const files=['parts/part01.txt','parts/part02.txt','parts/part03.txt','parts/part04.txt','parts/part05.txt','parts/part06.txt','parts/part07.txt','parts/part08.txt','parts/part09.txt','parts/part10.txt','parts/part11.txt','parts/part12.txt','parts/part13.txt'];
  try{
    const parts=await Promise.all(files.map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f);return r.text()})));
    const html=parts.join('');
    document.open();document.write(html);document.close();
  }catch(e){document.getElementById('loading').textContent='ERROR AL CARGAR LEGACY';console.error(e)}
})();
</script>
</body></html>
