<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>SAFARI 2026 — LEGACY</title>
  <style>
    html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:Arial,sans-serif}
    body{display:grid;place-items:center;min-height:100vh}
    #loading{font-size:12px;letter-spacing:.28em;opacity:.65;text-align:center;padding:24px}
  </style>
</head>
<body>
  <div id="loading">SAFARI 2026 — LEGACY · CARGANDO…</div>
  <script>
    async function loadLegacy(){
      const files=[
        './payload/legacy-v11-01.txt',
        './payload/legacy-v11-02.txt',
        './payload/legacy-v11-03.txt',
        './payload/legacy-v11-04.txt'
      ];
      const parts=await Promise.all(files.map(async f=>{
        const r=await fetch(f,{cache:'no-store'});
        if(!r.ok) throw new Error('No se pudo cargar '+f);
        return (await r.text()).trim();
      }));
      const b64=parts.join('');
      const raw=atob(b64);
      const bytes=new Uint8Array(raw.length);
      for(let i=0;i<raw.length;i++) bytes[i]=raw.charCodeAt(i);
      let html;
      if('DecompressionStream' in window){
        const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
        html=await new Response(stream).text();
      }else{
        await new Promise((resolve,reject)=>{
          const s=document.createElement('script');
          s.src='https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js';
          s.onload=resolve;s.onerror=reject;document.head.appendChild(s);
        });
        html=new TextDecoder().decode(window.pako.ungzip(bytes));
      }
      document.open();
      document.write(html);
      document.close();
    }
    loadLegacy().catch(err=>{
      console.error(err);
      document.getElementById('loading').textContent='ERROR AL CARGAR SAFARI 2026 — LEGACY';
    });
  </script>
</body>
</html>
