<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>SAFARI 2026 — LEGACY</title>
  <style>
    html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:Arial,sans-serif}
    body{display:grid;place-items:center;min-height:100vh}
    #loading{font-size:12px;letter-spacing:.28em;opacity:.65;text-align:center;padding:24px}
  </style>
</head>
<body>
  <div id="loading">SAFARI 2026 — LEGACY · CARGANDO…</div>
  <script>
    async function gunzip(bytes){
      if('DecompressionStream' in window){
        const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
        return await new Response(stream).text();
      }
      await new Promise((resolve,reject)=>{
        const s=document.createElement('script');
        s.src='https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js';
        s.onload=resolve;s.onerror=reject;document.head.appendChild(s);
      });
      return new TextDecoder().decode(window.pako.ungzip(bytes));
    }

    async function loadLegacy(){
      const r=await fetch('./legacy-v11.html.gz?v=5',{cache:'no-store'});
      if(!r.ok) throw new Error('No se pudo cargar legacy-v11.html.gz');
      const bytes=new Uint8Array(await r.arrayBuffer());
      let html;

      if(bytes.length>=2 && bytes[0]===0x1f && bytes[1]===0x8b){
        html=await gunzip(bytes);
      }else{
        html=new TextDecoder().decode(bytes);
      }

      const normalized=html.trimStart().toLowerCase();
      if(!normalized.startsWith('<!doctype html') && !normalized.startsWith('<html')){
        throw new Error('El contenido recibido no es HTML válido');
      }

      document.open();
      document.write(html);
      document.close();
    }

    loadLegacy().catch(err=>{
      console.error(err);
      const el=document.getElementById('loading');
      el.textContent='ERROR AL CARGAR SAFARI 2026 — LEGACY';
      el.title=String(err && err.message ? err.message : err);
    });
  </script>
</body>
</html>
