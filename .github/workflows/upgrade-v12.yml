name: Upgrade Safari Legacy v12

on:
  push:
    paths:
      - '.github/workflows/upgrade-v12.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rebuild patch
        run: |
          cat patches/v12-01.b64 patches/v12-02.b64 patches/v12-03.b64 patches/v12-04.b64 | tr -d '\r\n ' | base64 -d | gzip -dc > /tmp/v12.patch
          test -s /tmp/v12.patch
      - name: Apply v12 patch
        run: |
          git apply --check /tmp/v12.patch
          git apply /tmp/v12.patch
          test "$(wc -c < index.html)" -eq 182797
          echo "168af24e85ce71dfb06cadc77c3b3552b2b8249afebb3b82ba3f0e0bac05542f  index.html" | sha256sum -c -
          grep -q 'name: "Johana"' index.html
          grep -q 'legacyComodinesV2' index.html
          grep -q 'safari_shared_sections' index.html
      - name: Commit v12
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Upgrade Safari 2026 Legacy to v12" || exit 0
          git push
