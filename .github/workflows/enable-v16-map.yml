name: Enable Safari v16 map

on:
  push:
    branches:
      - main
    paths:
      - 'deploy/v16-map-loader.js'
      - '.github/workflows/enable-v16-map.yml'

permissions:
  contents: write

jobs:
  enable-v16-map:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enable authoritative V16 + V22 map loader
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="./deploy/v16-map-loader.js?v=22"></script>'

          pattern = r'<script\s+src=["\']\./deploy/v16-map-loader\.js\?v=\d+["\']\s*></script>'
          if re.search(pattern, s):
              s = re.sub(pattern, tag, s, count=1)
          elif 'deploy/v16-map-loader.js' not in s:
              s = s.replace('</body>', f'  {tag}\n</body>', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit loader reference
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "v22 cache key already enabled"
          else
            git commit -m "Load Safari map v22 without stale cache [skip ci]"
            git push
          fi
