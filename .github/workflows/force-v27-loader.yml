name: Force Safari V27 loader

on:
  push:
    branches: ["main"]
    paths:
      - '.github/workflows/force-v27-loader.yml'

permissions:
  contents: write

jobs:
  switch-loader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Switch index to V27
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pattern = r'\.\/deploy\/v16-map-loader\.js\?v=\d+'
          s2, count = re.subn(pattern, './deploy/v16-map-loader.js?v=27', s)
          if count == 0:
              raise SystemExit('Map loader reference not found')
          p.write_text(s2, encoding='utf-8')
          PY

      - name: Commit V27 loader switch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Index already uses V27"
          else
            git commit -m "Activate Safari V27 map loader"
            git push
          fi
