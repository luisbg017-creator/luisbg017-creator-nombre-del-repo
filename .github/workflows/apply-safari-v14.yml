name: Apply Safari v14 patch

on:
  push:
    branches:
      - main
    paths:
      - 'deploy/safari-v14.patch'

permissions:
  contents: write

jobs:
  apply-v14:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and apply v14 patch
        run: |
          git apply --check deploy/safari-v14.patch
          git apply deploy/safari-v14.patch

      - name: Commit v14
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Publish Safari 2026 Legacy v14 [skip ci]"
          git push
