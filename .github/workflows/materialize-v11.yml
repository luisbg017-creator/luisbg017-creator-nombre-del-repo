name: Materialize Safari Legacy v11

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/materialize-v11.yml'
      - 'payload/legacy-v11-01.txt'
      - 'payload/fix2a-01.txt'
      - 'payload/fix2a-02.txt'
      - 'payload/fix2a-03.txt'
      - 'payload/fix2a-04.txt'
      - 'payload/fix2a-05.txt'
      - 'payload/fix2-02.txt'
      - 'payload/fix2-03.txt'
      - 'payload/fix2-04.txt'
      - 'payload/legacy-v11-03.txt'
      - 'payload/legacy-v11-04.txt'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rebuild and verify direct v11 HTML
        run: |
          cat payload/legacy-v11-01.txt payload/fix2a-01.txt payload/fix2a-02.txt payload/fix2a-03.txt payload/fix2a-04.txt payload/fix2a-05.txt payload/fix2-02.txt payload/fix2-03.txt payload/fix2-04.txt payload/legacy-v11-03.txt payload/legacy-v11-04.txt | tr -d '\r\n ' | base64 -d > /tmp/legacy-v11.html.gz
          gzip -t /tmp/legacy-v11.html.gz
          gzip -dc /tmp/legacy-v11.html.gz > index.html
          test -s index.html
          test "$(wc -c < index.html)" -eq 169257
          echo "ea293ada86e01806f3c9db04145c5885f8c1f1942f54eb35b38fa47a823b4523  index.html" | sha256sum -c -
          grep -q '<!DOCTYPE html>' index.html
          grep -q 'SAFARI 2026' index.html
      - name: Commit direct HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html already matches v11"
          else
            git commit -m "Publish Safari 2026 Legacy v11 as direct HTML"
            git push
          fi
